name: Python Linting (Ruff)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Ruff
        uses: astral-sh/ruff-action@v3
        with:
          args: "check ."

      - name: Check Formatting
        uses: astral-sh/ruff-action@v3
        with:
          args: "format --check ."