[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "feature-dictionary"
version = "0.1.0"
description = "Send species_database.txt plus a configurable prompt to several local Ollama models and log every response, duration and token count."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ollama>=0.6.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6.0",
]

[project.scripts]
feature-dictionary = "feature_dictionary.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["feature_dictionary"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

